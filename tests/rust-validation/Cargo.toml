[package]
name = "rand-validation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bc-rand = "=0.5.0"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The reference's arithmetic must be *checked*: a signed range whose length
# exceeds its width's MAX overflows `upper_bound - lower_bound` in bc-rand
# (i8, i16, i32 and i64 alike), and the panic is the outcome the port mirrors
# (RandError RangeTooLong). Unchecked, Cargo's default release profile wraps
# and returns a value from a wrong range (recorded as D1 in RUST_DIVERGENCES.md).
[profile.release]
overflow-checks = true
