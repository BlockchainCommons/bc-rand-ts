[package]
name = "rand-validation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bc-rand = "=0.5.0"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The reference's arithmetic must be *checked*: an i64 range whose length
# exceeds i64::MAX overflows `upper_bound - lower_bound` in bc-rand, and the
# panic is the outcome the port mirrors (RangeError). Unchecked, release
# Rust would wrap and return a value from a wrong range.
[profile.release]
overflow-checks = true
